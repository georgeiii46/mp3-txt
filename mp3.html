<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TXT Audio Player</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #24283b 0%, #0d0f14 55%);
    color: #fff;
    font-family: Inter, Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;
}

.player {
    width: 100%;
    max-width: 760px;

    background: rgba(25, 27, 34, .95);
    border: 1px solid rgba(255,255,255,.08);

    border-radius: 24px;
    padding: 28px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.04);
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 25px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 22px;
    font-weight: 700;
}

.logo-icon {
    width: 42px;
    height: 42px;

    border-radius: 12px;

    display: grid;
    place-items: center;

    background: linear-gradient(
        135deg,
        #5865f2,
        #8b5cf6
    );

    font-size: 21px;
}

.file-count {
    color: #9699a5;
    font-size: 14px;
}

/* DROP AREA */

.drop-zone {
    border: 2px dashed #3d414e;
    border-radius: 18px;

    padding: 35px 20px;

    text-align: center;

    cursor: pointer;

    transition:
        background .2s,
        border-color .2s,
        transform .2s;
}

.drop-zone:hover,
.drop-zone.dragging {
    background: rgba(88,101,242,.08);
    border-color: #5865f2;
    transform: translateY(-1px);
}

.drop-icon {
    font-size: 42px;
    margin-bottom: 10px;
}

.drop-zone h2 {
    margin: 0 0 7px;
    font-size: 19px;
}

.drop-zone p {
    margin: 0;
    color: #9699a5;
    font-size: 14px;
}

#fileInput {
    display: none;
}

/* NOW PLAYING */

.now-playing {
    margin-top: 25px;

    padding: 22px;

    border-radius: 17px;

    background: #14161c;

    text-align: center;
}

.album-icon {
    width: 100px;
    height: 100px;

    margin: 0 auto 18px;

    border-radius: 20px;

    display: grid;
    place-items: center;

    font-size: 45px;

    background:
        linear-gradient(
            135deg,
            #5865f2,
            #a855f7
        );

    box-shadow:
        0 15px 35px rgba(88,101,242,.25);
}

.song-name {
    font-size: 18px;
    font-weight: 700;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.song-format {
    margin-top: 6px;

    color: #8f93a1;
    font-size: 13px;
}

/* AUDIO */

audio {
    width: 100%;
    margin-top: 18px;
}

/* CONTROLS */

.controls {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 12px;

    margin: 20px 0;
}

button {
    border: 0;
    cursor: pointer;

    color: white;

    background: #292c35;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    font-size: 18px;

    transition:
        transform .15s,
        background .15s;
}

button:hover {
    background: #383c48;
    transform: scale(1.05);
}

button:active {
    transform: scale(.96);
}

.play-button {
    width: 62px;
    height: 62px;

    background:
        linear-gradient(
            135deg,
            #5865f2,
            #7c4dff
        );

    font-size: 23px;
}

.play-button:hover {
    background:
        linear-gradient(
            135deg,
            #6875ff,
            #8c60ff
        );
}

/* PLAYLIST */

.playlist-title {
    display: flex;
    justify-content: space-between;

    margin: 25px 2px 10px;

    color: #b9bcc7;

    font-size: 13px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: .7px;
}

.playlist {
    max-height: 260px;
    overflow-y: auto;

    padding-right: 4px;
}

.playlist::-webkit-scrollbar {
    width: 6px;
}

.playlist::-webkit-scrollbar-thumb {
    background: #363945;
    border-radius: 10px;
}

.track {
    display: flex;
    align-items: center;

    gap: 12px;

    padding: 12px 14px;

    margin-bottom: 5px;

    border-radius: 12px;

    cursor: pointer;

    background: #1b1e25;

    transition: background .15s;
}

.track:hover {
    background: #252934;
}

.track.active {
    background: rgba(88,101,242,.22);
    border: 1px solid rgba(88,101,242,.35);
}

.track-number {
    width: 25px;

    color: #777b88;

    font-size: 13px;

    text-align: center;
}

.track-info {
    min-width: 0;
    flex: 1;
}

.track-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    font-size: 14px;
}

.track-format {
    margin-top: 3px;

    color: #777b88;

    font-size: 11px;
}

.status {
    text-align: center;

    color: #777b88;

    font-size: 13px;

    margin-top: 15px;

    min-height: 18px;
}
</style>
</head>

<body>

<div class="player">

    <div class="header">

        <div class="logo">
            <div class="logo-icon">♫</div>
            TXT Audio Player
        </div>

        <div class="file-count" id="fileCount">
            0 files
        </div>

    </div>


    <!-- DROP AREA -->

    <label class="drop-zone" id="dropZone">

        <input
            type="file"
            id="fileInput"
            multiple
            accept=".txt"
        >

        <div class="drop-icon">📂</div>

        <h2>
            Drop your audio files here
        </h2>

        <p>
            Renamed .txt audio files are supported
        </p>

    </label>


    <!-- NOW PLAYING -->

    <div class="now-playing">

        <div class="album-icon">
            ♪
        </div>

        <div class="song-name" id="songName">
            Nothing playing
        </div>

        <div class="song-format" id="songFormat">
            Add some files to begin
        </div>

        <audio
            id="audio"
            controls
            preload="metadata">
        </audio>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            onclick="previousTrack()"
            title="Previous">
            ⏮
        </button>

        <button
            class="play-button"
            onclick="togglePlay()"
            id="playButton"
            title="Play">
            ▶
        </button>

        <button
            onclick="nextTrack()"
            title="Next">
            ⏭
        </button>

    </div>


    <!-- PLAYLIST -->

    <div class="playlist-title">
        <span>Playlist</span>
        <span id="playlistCount">0</span>
    </div>

    <div
        class="playlist"
        id="playlist">
    </div>


    <div
        class="status"
        id="status">
    </div>

</div>


<script>

let tracks = [];
let currentIndex = -1;

const input = document.getElementById("fileInput");
const dropZone = document.getElementById("dropZone");

const audio = document.getElementById("audio");

const playlist = document.getElementById("playlist");

const songName = document.getElementById("songName");
const songFormat = document.getElementById("songFormat");

const playButton = document.getElementById("playButton");

const fileCount = document.getElementById("fileCount");
const playlistCount = document.getElementById("playlistCount");

const status = document.getElementById("status");


// ============================================================
// FILE PICKER
// ============================================================

input.addEventListener("change", () => {

    addFiles([...input.files]);

    input.value = "";

});


// ============================================================
// DRAG & DROP
// ============================================================

dropZone.addEventListener("dragover", event => {

    event.preventDefault();

    dropZone.classList.add("dragging");

});


dropZone.addEventListener("dragleave", () => {

    dropZone.classList.remove("dragging");

});


dropZone.addEventListener("drop", event => {

    event.preventDefault();

    dropZone.classList.remove("dragging");

    addFiles([...event.dataTransfer.files]);

});


// ============================================================
// ADD FILES
// ============================================================

async function addFiles(files) {

    status.textContent = "Scanning files...";

    let added = 0;

    for (const file of files) {

        if (
            !file.name
                .toLowerCase()
                .endsWith(".txt")
        ) {
            continue;
        }

        const format =
            await detectFormat(file);

        if (!format) {
            continue;
        }

        tracks.push({
            file: file,
            format: format,
            url: null
        });

        added++;

    }

    renderPlaylist();

    updateCounts();

    if (tracks.length > 0 && currentIndex === -1) {

        loadTrack(0);

    }

    if (added > 0) {

        status.textContent =
            `${added} file${added === 1 ? "" : "s"} added.`;

    } else {

        status.textContent =
            "No supported audio files found.";

    }

}


// ============================================================
// DETECT AUDIO FORMAT
// ============================================================

async function detectFormat(file) {

    /*
        Read enough bytes from the beginning of the file
        to identify common audio containers.
    */

    const buffer =
        await file.slice(0, 64).arrayBuffer();

    const b =
        new Uint8Array(buffer);


    // MP3 with ID3 tag

    if (
        b[0] === 0x49 &&
        b[1] === 0x44 &&
        b[2] === 0x33
    ) {
        return {
            name: "MP3",
            mime: "audio/mpeg"
        };
    }


    // MP3 frame

    if (
        b.length >= 2 &&
        b[0] === 0xff &&
        (b[1] & 0xe0) === 0xe0
    ) {
        return {
            name: "MP3",
            mime: "audio/mpeg"
        };
    }


    // WAV

    if (
        ascii(b, 0, 4) === "RIFF" &&
        ascii(b, 8, 4) === "WAVE"
    ) {
        return {
            name: "WAV",
            mime: "audio/wav"
        };
    }


    // FLAC

    if (
        ascii(b, 0, 4) === "fLaC"
    ) {
        return {
            name: "FLAC",
            mime: "audio/flac"
        };
    }


    // OGG

    if (
        ascii(b, 0, 4) === "OggS"
    ) {
        return {
            name: "OGG",
            mime: "audio/ogg"
        };
    }


    // M4A / MP4

    if (
        ascii(b, 4, 4) === "ftyp"
    ) {
        return {
            name: "M4A / MP4",
            mime: "audio/mp4"
        };
    }


    // AIFF

    if (
        ascii(b, 0, 4) === "FORM" &&
        (
            ascii(b, 8, 4) === "AIFF" ||
            ascii(b, 8, 4) === "AIFC"
        )
    ) {
        return {
            name: "AIFF",
            mime: "audio/aiff"
        };
    }


    // AMR

    if (
        ascii(b, 0, 5) === "#!AMR"
    ) {
        return {
            name: "AMR",
            mime: "audio/amr"
        };
    }


    return null;
}


// ============================================================
// ASCII HELPER
// ============================================================

function ascii(bytes, start, length) {

    let result = "";

    for (
        let i = start;
        i < start + length;
        i++
    ) {

        result += String.fromCharCode(
            bytes[i] || 0
        );

    }

    return result;
}


// ============================================================
// CREATE PLAYLIST
// ============================================================

function renderPlaylist() {

    playlist.innerHTML = "";

    tracks.forEach((track, index) => {

        const item =
            document.createElement("div");

        item.className = "track";

        item.innerHTML = `
            <div class="track-number">
                ${index + 1}
            </div>

            <div class="track-info">

                <div class="track-name">
                    ${escapeHTML(track.file.name)}
                </div>

                <div class="track-format">
                    ${track.format.name}
                </div>

            </div>
        `;

        item.addEventListener(
            "click",
            () => loadTrack(index)
        );

        playlist.appendChild(item);

    });

    updateActive();
}


// ============================================================
// LOAD TRACK
// ============================================================

function loadTrack(index) {

    if (
        index < 0 ||
        index >= tracks.length
    ) {
        return;
    }

    currentIndex = index;

    const track = tracks[index];


    /*
        IMPORTANT:
        We create a new Blob using the detected MIME type.

        The original file can still be named .txt.
    */

    const blob =
        new Blob(
            [track.file],
            {
                type: track.format.mime
            }
        );


    if (track.url) {

        URL.revokeObjectURL(
            track.url
        );

    }


    track.url =
        URL.createObjectURL(blob);


    audio.src = track.url;

    songName.textContent =
        track.file.name;

    songFormat.textContent =
        "Detected: " +
        track.format.name;


    updateActive();

    audio.play()
        .then(() => {

            playButton.textContent = "⏸";

        })
        .catch(() => {

            playButton.textContent = "▶";

        });

}


// ============================================================
// PLAY / PAUSE
// ============================================================

function togglePlay() {

    if (currentIndex === -1) {

        if (tracks.length > 0) {
            loadTrack(0);
        }

        return;
    }


    if (audio.paused) {

        audio.play();

    } else {

        audio.pause();

    }

}


// ============================================================
// AUDIO EVENTS
// ============================================================

audio.addEventListener(
    "play",
    () => {
        playButton.textContent = "⏸";
    }
);

audio.addEventListener(
    "pause",
    () => {
        playButton.textContent = "▶";
    }
);


audio.addEventListener(
    "ended",
    () => {
        nextTrack();
    }
);


// ============================================================
// NEXT
// ============================================================

function nextTrack() {

    if (tracks.length === 0) {
        return;
    }

    let next =
        currentIndex + 1;


    if (next >= tracks.length) {
        next = 0;
    }


    loadTrack(next);
}


// ============================================================
// PREVIOUS
// ============================================================

function previousTrack() {

    if (tracks.length === 0) {
        return;
    }


    /*
        If the song has played for more than 3 seconds,
        restart the current song.
    */

    if (audio.currentTime > 3) {

        audio.currentTime = 0;

        return;

    }


    let previous =
        currentIndex - 1;


    if (previous < 0) {
        previous = tracks.length - 1;
    }


    loadTrack(previous);
}


// ============================================================
// UPDATE COUNTS
// ============================================================

function updateCounts() {

    const count = tracks.length;

    fileCount.textContent =
        `${count} file${count === 1 ? "" : "s"}`;

    playlistCount.textContent =
        count;

}


// ============================================================
// ACTIVE TRACK
// ============================================================

function updateActive() {

    const items =
        document.querySelectorAll(".track");


    items.forEach(
        (item, index) => {

            item.classList.toggle(
                "active",
                index === currentIndex
            );

        }
    );

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
